<!doctype html>
<meta charset="utf-8">
<title>Chester Mission Control</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* SpaceX treatment: pure black ground, D-DIN (their face, self-hosted),
   uppercase tracked micro-labels, 300-weight mission-counter numerals,
   hairlines instead of card chrome, sharp corners. Single-theme on purpose:
   this is an ops console, it commits to black. Color is semantic only. */
@font-face{font-family:'D-DIN';src:url('fonts/D-DIN.woff') format('woff');
  font-weight:100 500;font-style:normal;font-display:swap}
@font-face{font-family:'D-DIN';src:url('fonts/D-DIN-Bold.woff') format('woff');
  font-weight:600 800;font-style:normal;font-display:swap}
:root{
  --bg:#000000; --panel:#0c0f10; --line:#26292b; --line-soft:#191c1e;
  --ink:#f4f6f6; --dim:#9ba1a6; --faint:#5c6266;
  --up:#2fbf71; --down:#ff5449; --warn:#f2b544;
  --din:'D-DIN','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--din);padding:0 32px 72px;
  -webkit-font-smoothing:antialiased}
/* centered measure - the console was running wall to wall on wide screens */
body>*:not(#tip){max-width:1280px;margin-left:auto;margin-right:auto}
h1{font-size:13px;font-weight:700;margin:0;letter-spacing:.34em;
  text-transform:uppercase}
h2{font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.26em;color:var(--dim);margin:0 0 18px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
.dim{color:var(--dim)} .faint{color:var(--faint)}

header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:22px 0 20px;border-bottom:1px solid var(--line)}
header .tag{font-size:10px;text-transform:uppercase;letter-spacing:.26em;
  padding:5px 12px;color:var(--down);border:1px solid var(--down)}
header .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:15px;font-weight:600;color:var(--ink);
  padding:4px 12px;border:1px solid var(--line)}
header .clock.soon{color:var(--warn);border-color:var(--warn)}
header .now{font-family:var(--mono);font-size:12px;color:var(--dim);
  letter-spacing:.06em}
header .when{margin-left:auto;font-size:11px;color:var(--faint);
  letter-spacing:.08em}

/* mission counters */
.hero{display:grid;grid-template-columns:repeat(6,1fr);
  border-bottom:1px solid var(--line);margin:0 auto 34px}
.hero div{padding:26px 22px 22px;min-width:0;
  border-left:1px solid var(--line-soft)}
.hero div:first-child{border-left:none;padding-left:0}
.hero .k{font-size:10px;text-transform:uppercase;letter-spacing:.24em;
  color:var(--dim);margin-bottom:10px}
.hero .v{font-size:34px;font-weight:300;line-height:1;
  font-family:var(--din);font-variant-numeric:tabular-nums;
  letter-spacing:.01em;white-space:nowrap}
.hero .sub{font-size:11px;color:var(--faint);margin-top:9px;
  letter-spacing:.03em;line-height:1.4}

.grid{display:grid;grid-template-columns:1fr;gap:44px}
@media(min-width:1100px){.grid.two{grid-template-columns:1.55fr 1fr}}
.card{background:transparent;border:none;border-top:1px solid var(--line);
  padding:20px 0 0}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.2em;color:var(--faint);font-weight:700;
  padding:0 0 12px 16px;white-space:nowrap;
  border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px 0 10px 16px;border-bottom:1px solid var(--line-soft);
  text-align:right;white-space:nowrap;
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td:first-child{font-family:var(--din)}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}

.dot{display:inline-block;width:6px;height:6px;margin-right:9px;
  vertical-align:1px}
.on{background:var(--up)} .off{background:var(--down)}
.coin{font-weight:700;letter-spacing:.1em}
.kv{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv span:first-child{text-transform:uppercase;font-size:10.5px;
  letter-spacing:.16em;align-self:center}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:11px;color:var(--faint);margin-top:14px;line-height:1.6;
  letter-spacing:.02em}
.err{border:1px solid var(--down);color:var(--down);
  padding:10px 14px;font-size:12px;margin:16px 0;
  text-transform:uppercase;letter-spacing:.08em}

/* open positions: a breathing white edge, not a glow */
tr.open-row td{background:#0e1213}
tr.open-row td:first-child{border-left:2px solid var(--ink);padding-left:10px}
tr.open-row{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
@media(prefers-reduced-motion:reduce){tr.open-row{animation:none}}

[data-tip]{cursor:help}
#tip{position:fixed;z-index:99;max-width:270px;padding:10px 13px;
  background:#0c0f10;border:1px solid var(--line);
  color:var(--ink);font-size:11.5px;line-height:1.55;pointer-events:none;
  letter-spacing:.02em;box-shadow:0 8px 28px #000c;display:none}

@media(max-width:760px){
  body{padding:0 14px 48px}
  header{gap:12px;padding:14px 0 12px}
  h1{letter-spacing:.22em}
  .hero{grid-template-columns:1fr 1fr}
  .hero div{padding:16px 12px 14px;border-left:none;
    border-top:1px solid var(--line-soft)}
  .hero div:nth-child(-n+2){border-top:none}
  .hero div:last-child{grid-column:1/-1;display:flex;align-items:baseline;gap:10px}
  .hero div:last-child .k,.hero div:last-child .sub{margin:0}
  .hero div:last-child .v{font-size:16px}
  .hero .v{font-size:24px}
  .grid{gap:28px}
  table{font-size:12px}
  th,td{padding-left:10px}
  .sm-hide{display:none}
}
</style>

<div id="tip"></div>
<header>
  <h1>Chester · Kalshi 15M</h1>
  <span class="tag">Live — Real Money</span>
  <span class="clock mono" id="clock" data-tip="time left in the current 15m window">—</span>
  <span class="now mono" id="nowct" data-tip="current time, US Central">—</span>
  <span class="when" id="when">…</span>
</header>
<div id="err"></div>
<div class="hero" id="hero"></div>
<div class="grid two">
  <div class="card">
    <h2>Per asset</h2>
    <div class="scroll"><table id="coins"></table></div>
    <div class="note" id="coinnote"></div>
  </div>
  <div>
    <div class="card" style="margin-bottom:18px">
      <h2>Risk</h2><div id="risk"></div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <h2>Execution</h2><div id="exec"></div>
    </div>

  </div>
</div>

<div class="card" style="margin-top:18px">
  <h2>Trade log</h2>
  <div class="scroll"><table id="feed"></table></div>
  <div class="note">Every order attempt, newest first, joined to how it ended.
  Misses (○) stay in on purpose — an accepted order that fills nothing is how
  the stale-quote bug showed itself. Blank result = position still open.</div>
</div>

<script>
const $=i=>document.getElementById(i);
const money=n=>(n==null?"—":(n<0?"−$":"$")+Math.abs(n).toFixed(2));
const pct=n=>n==null?"—":(n*100).toFixed(n>=0.995?0:1)+"%";
const cls=n=>n==null?"":(n>0?"up":n<0?"down":"dim");

function hero(d){
  const x=d.exchange||{}, e=d.era||{};
  const cells=[
    ["Balance", money(x.balance), "from Kalshi",
      "account cash straight from Kalshi's balance endpoint, refreshed every minute"],
    ["Today", money(x.day), (x.settled||0)+" settled · "+(x.winners||0)+" won",
      "balance now minus balance at the start of the trading day"],
    ["All time", money(x.total)
        +(x.total_pct==null?"":` <span style="font-size:14px" class="${cls(x.total_pct)}">${x.total_pct>=0?"+":""}${x.total_pct.toFixed(1)}%</span>`),
      "on $"+(x.deposited==null?"200":x.deposited.toFixed(0))+" deposited"
        +(x.withdrawn?` · $${x.withdrawn.toFixed(0)} withdrawn`:""),
      "return on capital YOU put in: (balance + withdrawn - deposited) / deposited. New deposits do not count as return, and withdrawing does not erase return already earned. Ledger: data/capital.json"],
    ["Fill rate", pct(e.rate), e.fills+" of "+e.attempts+" since the pricing fix",
      "share of orders that actually crossed, measured since the orderbook pricing fix (before it: 6%)"],
    ["Win rate", pct(x.settled?x.winners/x.settled:null), "breakeven ≈ 12.7% at 8x",
      "settled winners over settled trades today. At ~8x average payoff, anything above ~12.7% is profitable"],
    ["Open", (x.open==null?"—":x.open), "positions right now",
      "contracts currently held and unsettled, from the exchange"],
  ];
  $("hero").innerHTML=cells.map(([k,v,s,tip],i)=>
    `<div data-tip="${tip}"><div class="k">${k}</div>
     <div class="v ${i===1?cls(x.day):i===2?cls(x.total):""}">${v}</div>
     <div class="sub">${s}</div></div>`).join("");
}

function fmtPx(v){
  if(v==null||isNaN(v)) return "\u2014";
  v=+v;
  // sub-dollar coins need the precision; BTC does not need cents
  return v>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0})
        :v>=10?v.toFixed(2):v.toFixed(4);
}
function coins(d){
  // per-asset P/L from Kalshi settlements, not our journal
  const per=(d.exchange||{}).per_asset||{};
  const spr=d.spreads||{};
  const rows=(d.coins||[]).slice().map(c=>{
    const e=per[c.key];
    return {...c, asset_pnl: e?e.pnl:null,
            s_w: e?e.w:null, s_n: e?e.n:null};
  }).sort((a,b)=>(b.asset_pnl??-1e9)-(a.asset_pnl??-1e9));
  let h=`<tr>
     <th data-tip="which coin. Green dot = its trader process is running; 'excl' = excluded from live trading">Asset</th>
     <th data-tip="time left in this coin's current 15-minute window">Window</th>
     <th data-tip="live spot price from Coinbase - what the coin trades at right now">Price</th>
     <th data-tip="the strike this window settles against: above it at expiry = YES wins">Strike</th>
     <th class="sm-hide" data-tip="how far spot is from the strike, in basis points. Positive = above the strike, so YES (over) is currently winning">Dist</th>
     <th data-tip="current price of the YES side from the live orderbook">Ask</th>
     <th class="sm-hide" data-tip="our model's probability that YES wins. Edge = this vs the ask">P(yes)</th>
     <th data-tip="net settled profit for this asset, from Kalshi's records - not our journal">P/L</th>
     <th data-tip="orders filled on this asset since going live">Fills</th>
     <th data-tip="settled wins / settled trades, from the exchange">W/L</th>
     <th class="sm-hide" data-tip="5-minute median spread in cents; \u21af flags a momentary spike the entry gate sits out">Spread</th></tr>`;
  for(const c of rows){
    const dist=c.dist_bps==null?"—":(c.dist_bps>0?"+":"")+c.dist_bps.toFixed(1);
    h+=`<tr>
      <td><span class="dot ${c.running?"on":"off"}"></span>
        <span class="coin">${c.label}</span>
        ${c.excluded?' <span class="warn" style="font-size:10px">excl</span>':""}</td>
      <td class="dim">${c.clock||"—"}</td>
      <td>${fmtPx(c.spot)}</td>
      <td class="dim">${fmtPx(c.strike)}</td>
      <td class="sm-hide ${cls(c.dist_bps)}">${dist}</td>
      <td>${c.yes_ask==null?"—":c.yes_ask.toFixed(2)}</td>
      <td class="dim sm-hide">${c.p_yes==null?"—":c.p_yes.toFixed(2)}</td>
      <td class="${cls(c.asset_pnl)}">${c.asset_pnl==null?"—":money(c.asset_pnl)}</td>
      <td>${c.fills||0}</td>
      <td><span class="up">${c.s_w??c.wins??0}</span><span class="faint">/</span><span class="dim">${c.s_n??c.closed??0}</span></td>
      <td class="sm-hide">${(()=>{const sp=spr[c.key];
        if(!sp||sp.med==null) return '<span class="dim">—</span>';
        const spike=sp.now>Math.max(2*sp.med,sp.med+2);
        return `<span class="${sp.med>=4?"warn":"dim"}">${sp.med.toFixed(1)}¢</span>`
             + (spike?` <span class="warn" data-tip="momentary: book thinned; gate sits these out">↯${sp.now.toFixed(0)}</span>`:"");
      })()}</td>
    </tr>`;
  }
  $("coins").innerHTML=h;
  $("coinnote").textContent="P/L and W/n are settled trades from Kalshi. Spread is the "
    +"5-minute median; \u21af flags a momentary spike (thin book, usually at a "
    +"window rollover) \u2014 the entry gate sits those out.";
}

function risk(d){
  const s=d.state||{}, x=d.exchange||{};
  const used=Math.min(1,Math.max(0,(-(x.day||0))/15));
  const cap=s.max_contracts, stage=s.stage;
  const stages=[1,3,8], next=stages[(stage||0)+1];
  $("risk").innerHTML=[
    ["Contract cap", cap+(next?` <span class="faint">→ ${next} at 10 fills</span>`:""),
      "most contracts one order may buy right now; the ramp lifts it 1 → 3 → 8 as fills accumulate"],
    ["Stage", `${stage} <span class="faint">(${s.orders_at_stage||0} fills in)</span>`,
      "which ramp step we are on, and filled orders counted toward the next step"],
    ["Daily stop", `<span class="${used>0.6?"down":"dim"}">${money(-(x.day||0)>0?-(x.day):0)} of $15</span>`,
      "realized loss so far against the hard $15/day cap - hitting it halts all trading until the day rolls"],
    ["Equity floor", "$50",
      "if account equity ever drops below $50, everything halts - fails closed if equity is unknown"],
    ["Halted", s.killed||x.halted?`<span class="down">${x.halted||"killed"}</span>`:'<span class="up">no</span>',
      "whether any kill condition is active right now"],
  ].map(([k,v,tip])=>`<div class="kv" data-tip="${tip}"><span class="dim">${k}</span><span>${v}</span></div>`).join("");
}

function exec(d){
  const e=d.era||{}, l=d.latency||{};
  let h=[
    ["Fill rate now", pct(e.rate)+` <span class="faint">${e.fills}/${e.attempts}</span>`,
      "orders filled / orders sent since the orderbook pricing fix (2026-08-26 02:39 UTC)"],
    ["Price improvement", e.improve_c==null?"\u2014":
        `<span class="${e.improve_c.median>=0?"up":"down"}">${e.improve_c.median>=0?"+":""}${e.improve_c.median.toFixed(1)}\u00a2</span> <span class="faint">worst ${e.improve_c.worst.toFixed(1)}\u00a2</span>`,
      "cents per contract better than the limit we quoted, median across fills. We send crossing limits with a cushion; the book usually fills better. If this drifts negative the cushion is being eaten"],
    ["Last fill", e.last_fill_ago==null?"\u2014":
        (e.last_fill_ago<3600?Math.round(e.last_fill_ago/60)+"m ago":(e.last_fill_ago/3600).toFixed(1)+"h ago"),
      "time since the most recent filled order across all assets"],
    ["Order latency", (l.median==null?"—":l.median+"ms")+` <span class="faint">p90 ${l.p90||"—"}ms</span>`,
      "round trip from sending an order to Kalshi's reply"],
  ].map(([k,v,tip])=>`<div class="kv" data-tip="${tip}"><span class="dim">${k}</span><span>${v}</span></div>`).join("");
  const r=e.reasons||[];
  h+=`<div class="note">${r.length
    ? "Unfilled since the fix: "+r.map(([k,n])=>`${k} ×${n}`).join(", ")
    : "No unfilled orders since the pricing fix. The all-time rate includes two "
      +"bugs that no longer exist — stale-quote limits that could not cross, and "
      +"orders sent to the wrong exchange index."}</div>`;
  $("exec").innerHTML=h;
}

function mss(sec){
  sec=Math.max(0,Math.round(sec));
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
}
function fmtTs(iso){
  // raw ts is UTC; render in the viewer's local time (Central) with the date,
  // because a feed that quietly mixes yesterday and today in UTC misleads.
  const t=new Date(iso);
  if(isNaN(t)) return (iso||"").slice(11,19);
  return t.toLocaleString("en-US",{timeZone:"America/Chicago",
    month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
}
function feed(d){
  const r=d.attempts_feed||[];
  if(!r.length){$("feed").innerHTML='<tr><td class="faint">no attempts yet</td></tr>';return;}
  let h=`<tr>
    <th data-tip="when the order was sent (Central time)">Time</th>
    <th data-tip="\u25cf filled  \u00b7  \u25cb accepted but nothing crossed">Fill</th>
    <th data-tip="which coin's 15-minute market">Asset</th>
    <th data-tip="every window asks: will price finish ABOVE the strike? yes = over, no = under">Side</th>
    <th data-tip="contracts filled / contracts requested">Qty</th>
    <th data-tip="what one contract cost us (a NO at yes-price 0.90 costs 0.10)">Cost</th>
    <th data-tip="gross payoff multiple if it wins: a 0.10 contract pays $1.00 = 10x">Pays</th>
    <th class="sm-hide" data-tip="how deep into the 15-minute window the order was placed (0:00 = window open)">Opened at</th>
    <th data-tip="time remaining to expiry when the order was placed">Left</th>
    <th data-tip="WON settled our way \u00b7 lost settled against us \u00b7 cut we exited early \u00b7 miss never filled \u00b7 open still riding">Result</th>
    <th data-tip="net profit after fees, from the exchange-settled close">Net</th>
    <th data-tip="open positions only: what our side's current bid pays to close now, with unrealized P&L against cost">Value</th></tr>`;
  for(const x of r){
    const hit=+x.filled>0, px=x.cost, o=x.outcome;
    let res='<span class="faint">\u2014</span>', net='';
    if(!hit){ res='<span class="down">miss</span>'; }
    else if(o){
      res=o.won?'<span class="up">WON</span>'
               :`<span class="down">${o.how==="flatten"?"cut":"lost"}</span>`;
      net=`<span class="${o.pnl>0?"up":o.pnl<0?"down":"dim"}">${money(o.pnl)}</span>`;
    } else { res='<span class="warn">open</span>'; }
    let val='';
    if(x.mtm){
      val=`<span class="mono">$${x.mtm.value.toFixed(2)}</span> `
         +`<span class="${x.mtm.unreal>0?"up":x.mtm.unreal<0?"down":"dim"}">(${x.mtm.unreal>=0?"+":""}${x.mtm.unreal.toFixed(2)})</span>`;
    }
    const isOpen = hit && !o;
    h+=`<tr class="${isOpen?"open-row":""}">
      <td class="dim" style="font-family:var(--mono)">${fmtTs(x.ts)}</td>
      <td class="${hit?"up":"down"}" data-tip="${hit?"order filled":"order missed - accepted but nothing crossed"}">${hit?"\u25cf":"\u25cb"}</td>
      <td><span class="coin">${(x.asset||"").toUpperCase()}</span></td>
      <td class="dim" data-tip="${x.side==="yes"?"betting price finishes ABOVE the strike (over)":"betting price finishes BELOW the strike (under)"}">${x.side||""}</td>
      <td>${hit?x.filled:0}/${x.requested||0}</td>
      <td>${px?px.toFixed(3):"\u2014"}</td>
      <td class="dim">${px?(1/px).toFixed(0)+"x":"\u2014"}</td>
      <td class="dim sm-hide">${mss(900-(x.remaining_sec||0))}</td>
      <td class="dim">${mss(x.remaining_sec||0)}</td>
      <td>${res}</td>
      <td>${net}</td>
      <td>${val}</td>
    </tr>`;
  }
  $("feed").innerHTML=h;
}

async function tick(){
  try{
    const d=await (await fetch("api/status",{cache:"no-store"})).json();
    $("err").innerHTML=(d.exchange&&d.exchange.error)
      ? `<div class="err">Kalshi read failed: ${d.exchange.error}</div>`:"";
    hero(d);coins(d);risk(d);exec(d);feed(d);
    if(d.window){clockLeft=d.window.left;}
    $("when").textContent=new Date().toLocaleString([],{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }catch(e){
    $("err").innerHTML=`<div class="err">dashboard fetch failed: ${e}</div>`;
  }
}
let clockLeft=null;
function paintClock(){
  const el=$("clock");
  if(clockLeft==null){el.textContent="—";return;}
  const m=Math.floor(clockLeft/60), sec=clockLeft%60;
  el.textContent=`${m}:${String(sec).padStart(2,"0")}`;
  el.classList.toggle("soon", clockLeft<=150);
}
function paintNow(){
  // pinned to America/Chicago, not browser-guessed - Cam is Central and this
  // must read the same from any device
  $("nowct").textContent=new Date().toLocaleTimeString("en-US",
    {timeZone:"America/Chicago",hour:"numeric",minute:"2-digit",second:"2-digit"})+" CT";
}
setInterval(()=>{ if(clockLeft!=null){ clockLeft=clockLeft>0?clockLeft-1:899; paintClock(); } paintNow(); },1000);
paintNow();
document.addEventListener("mousemove",e=>{
  const el=e.target.closest&&e.target.closest("[data-tip]");
  const t=$("tip");
  if(!el){t.style.display="none";return;}
  t.textContent=el.getAttribute("data-tip");
  t.style.display="block";
  const pad=14, w=t.offsetWidth, h=t.offsetHeight;
  let x=e.clientX+pad, y=e.clientY+pad;
  if(x+w>innerWidth-8) x=e.clientX-w-pad;
  if(y+h>innerHeight-8) y=e.clientY-h-pad;
  t.style.left=x+"px"; t.style.top=y+"px";
});
tick();setInterval(tick,5000);
</script>

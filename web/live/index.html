<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE — crypto 15m</title>
<style>
  :root{--bg:#080b11;--panel:#0e141d;--line:#1d2634;--ink:#e8eef7;--dim:#8fa3bf;
        --amber:#ffb454;--up:#26d07c;--down:#ff5c5c;--flat:#6b7d99;--red:#ff3b3b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:1500px;margin:0 auto;padding:16px 20px 40px}
  h1{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);
     margin:0 0 2px;font-weight:700}
  .sub{color:var(--dim);font-size:11px;margin-bottom:16px}
  h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
     margin:22px 0 7px;font-weight:600}
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
  .kpi .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .kpi .v{font-size:21px;font-weight:700;margin-top:3px}
  .kpi .s{font-size:11px;color:var(--dim);margin-top:2px}
  table{border-collapse:collapse;width:100%}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
     text-align:right;padding:0 9px 5px;font-weight:600;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:5px 9px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4a5568;
       margin-right:6px;vertical-align:middle}
  .live .dot{background:var(--up)}
  .up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--dim)}.amber{color:var(--amber)}
  .kill{background:#3a0d0d;border:1px solid var(--red);color:#ffb3b3;padding:8px 12px;
        border-radius:4px;margin-bottom:14px;display:none}
  .tape{font-size:11px}
</style>
<div class="wrap">
  <h1>● LIVE — real money</h1>
  <div class="sub" id="sub">loading…</div>
  <div class="kill" id="kill">LIVE_KILL is present — trading halted</div>

  <div class="kpis" id="kpis"></div>

  <h2>By coin</h2>
  <table><thead><tr><th>Coin</th><th>Attempts</th><th>Fills</th><th>Fill rate</th>
    <th>Exits</th><th>Status</th></tr></thead><tbody id="coins"></tbody></table>

  <h2>Fill rate by book staleness <span class="dim">— does a faster feed help?</span></h2>
  <table><thead><tr><th>Book age</th><th>Orders</th><th>Filled</th><th>Rate</th></tr></thead>
    <tbody id="buckets"></tbody></table>

  <h2>Why orders are refused</h2>
  <table><thead><tr><th>Reason</th><th>Count</th></tr></thead><tbody id="reasons"></tbody></table>

  <h2>Recent orders</h2>
  <table class="tape"><thead><tr><th>Time</th><th>Coin</th><th>Side</th><th>Limit</th>
    <th>Filled</th><th>At</th><th>Book age</th><th>RT</th><th>Status</th></tr></thead>
    <tbody id="tape"></tbody></table>
</div>
<script>
const pct = v => v === null || v === undefined ? "—" : (v*100).toFixed(0) + "%";
const ms  = v => v ? Math.round(v) + "ms" : "—";

function kpi(l, v, s, cls) {
  return `<div class="kpi"><div class="l">${l}</div>
          <div class="v ${cls||''}">${v}</div><div class="s">${s||""}</div></div>`;
}

async function tick() {
  try {
    const r = await fetch("api/status", {cache:"no-store"});
    const d = await r.json();
    const st = d.state;

    document.getElementById("kill").style.display = st.killed ? "block" : "none";
    document.getElementById("sub").textContent =
      `micro only · stage ${st.stage} · max ${st.max_contracts} contract(s) · ` +
      `${st.orders_at_stage} orders at this stage`;

    const pnl = parseFloat(st.realized || 0);
    document.getElementById("kpis").innerHTML =
      kpi("Fill rate", pct(d.rate), `${d.fills} of ${d.attempts} orders`,
          d.rate > 0.3 ? "up" : d.rate > 0 ? "amber" : "down") +
      kpi("Realised today", (pnl>=0?"+":"−") + "$" + Math.abs(pnl).toFixed(4),
          "cap $15", pnl >= 0 ? "up" : "down") +
      kpi("Order round trip", ms(d.latency.median), "p90 " + ms(d.latency.p90)) +
      kpi("Max size", st.max_contracts + " contract" + (st.max_contracts>1?"s":""),
          "stage " + st.stage);

    document.getElementById("coins").innerHTML = (d.coins||[]).map(c => `
      <tr class="${c.running?'live':''}"><td><span class="dot"></span>${c.label}</td>
      <td>${c.attempts}</td><td class="${c.fills?'up':'dim'}">${c.fills}</td>
      <td>${pct(c.rate)}</td><td class="dim">${c.exits}</td>
      <td class="dim">${c.running ? "running" : "STALE"}</td></tr>`).join("");

    document.getElementById("buckets").innerHTML = (d.buckets||[]).map(b => `
      <tr><td>${b.k}</td><td>${b.n}</td><td class="${b.f?'up':'dim'}">${b.f}</td>
      <td>${pct(b.n?b.f/b.n:null)}</td></tr>`).join("")
      || '<tr><td class="dim" colspan="4">no instrumented orders yet</td></tr>';

    document.getElementById("reasons").innerHTML = (d.reasons||[]).map(x => `
      <tr><td class="dim">${x[0]}</td><td>${x[1]}</td></tr>`).join("");

    document.getElementById("tape").innerHTML = (d.recent||[]).map(o => `
      <tr><td>${(o.ts||"").slice(11,19)}</td><td>${(o.asset||"").toUpperCase()}</td>
      <td>${o.side||""}</td><td>${o.quoted_px||""}</td>
      <td class="${o.filled?'up':'down'}">${o.filled}</td><td>${o.fill_px||"—"}</td>
      <td class="dim">${ms(o.book_age_ms)}</td><td class="dim">${ms(o.order_ms)}</td>
      <td class="dim">${(o.status||"").slice(0,30)}</td></tr>`).join("");
  } catch(e) { /* keep last good frame */ }
}
tick(); setInterval(tick, 3000);
</script>
